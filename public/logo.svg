<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- White circle background -->
  <circle cx="128" cy="128" r="120" fill="white" stroke="#333" stroke-width="2"/>
  
  <!-- Bridge outline (simplified) -->
  <path d="M 60 100 Q 80 80 100 100 Q 120 80 140 100 Q 160 80 180 100" 
        stroke="black" stroke-width="3" fill="none" opacity="0.3"/>
  
  <!-- King figure (simplified) -->
  <circle cx="180" cy="80" r="15" fill="#FF8C00"/>
  <rect x="175" y="95" width="10" height="20" fill="#FFD700"/>
  <path d="M 180 70 L 185 75 L 180 80 L 175 75 Z" fill="#FFD700"/>
  
  <!-- Easy text -->
  <text x="128" y="120" font-family="Arial, sans-serif" font-size="36" font-weight="bold" 
        fill="#FFD700" stroke="black" stroke-width="2" text-anchor="middle">Easy</text>
  
  <!-- BRAND text -->
  <text x="128" y="145" font-family="Arial, sans-serif" font-size="14" font-weight="bold" 
        fill="red" text-anchor="middle">BRAND</text>
  
  <!-- CEBU text -->
  <text x="128" y="165" font-family="Arial, sans-serif" font-size="20" font-weight="bold" 
        fill="red" stroke="#FFD700" stroke-width="1" text-anchor="middle">CEBU</text>
  
  <!-- Decorative flags -->
  <circle cx="50" cy="200" r="4" fill="red"/>
  <circle cx="60" cy="195" r="4" fill="green"/>
  <circle cx="70" cy="200" r="4" fill="yellow"/>
  <circle cx="80" cy="195" r="4" fill="white"/>
  
  <circle cx="206" cy="200" r="4" fill="red"/>
  <circle cx="196" cy="195" r="4" fill="green"/>
  <circle cx="186" cy="200" r="4" fill="yellow"/>
  
  <!-- Registered trademark -->
  <circle cx="165" cy="105" r="6" fill="black"/>
  <text x="165" y="109" font-family="Arial" font-size="8" fill="white" text-anchor="middle">R</text>
</svg>
